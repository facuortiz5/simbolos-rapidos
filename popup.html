<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Símbolos rápidos</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <p class="eyebrow">SÍMBOLOS RÁPIDOS</p>
        <h1>Encontrá el carácter que buscás</h1>
      </header>

      <form id="search-form" class="search" role="search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"></path>
        </svg>
        <input
          id="search-input"
          type="search"
          placeholder="Probá “enie”, “slash” o “euro”"
          aria-label="Buscar un símbolo"
          autocomplete="off"
          autofocus
        >
      </form>

      <p class="hint">Hacé clic para copiar | Enter copia el primero</p>
      <section id="results" class="results" aria-label="Resultados"></section>
      <section id="suggestion-state" class="suggestion" hidden>
        <h2 class="suggestion__title">¿No encontrás el símbolo que buscás?</h2>
        <form id="suggestion-form" class="suggestion__form">
          <textarea
            id="suggestion-input"
            rows="2"
            placeholder="Describí la letra o símbolo y lo agrego en una próxima actualización."
            aria-label="Describir la letra o símbolo faltante"
            required
          ></textarea>
          <button id="suggestion-submit" class="suggestion__submit" type="submit">
            Enviar sugerencia
          </button>
        </form>
        <p id="suggestion-success" class="suggestion__message suggestion__message--success" role="status" hidden>
          ¡Gracias! Recibí tu sugerencia.
        </p>
        <p id="suggestion-error" class="suggestion__message suggestion__message--error" role="alert" hidden>
          No pudimos enviar la sugerencia. Probá de nuevo.
        </p>
      </section>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <script src="symbols.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
